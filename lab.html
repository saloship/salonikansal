<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>M3 · The Desk — scroll-driven camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* TRUE BLUEPRINT — reversed print. The drawing is white line on navy, and the
     copy sits on a piece of sheet laid over it. That is what fixes the contrast:
     the text now holds the strongest value on the page instead of competing with
     the linework at the same lightness. */
  --navy:#122a45; --navy-2:#17324f;
  --paper:#f2f5f9; --rule:#1b3958; --rule-2:#c6d4e5;
  --card-ink:#132437; --card-ink-2:#485d76;
  --sun:#f5c518; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  /* lighter lines on a dark ground bloom, so every weight comes down from the
     values that were right on white — 2.6 outline reads fat here */
  --w-ol:2.1; --w-vis:1.25; --w-hid:1.0; --w-con:0.9;
  --bp-ground:#122a45; --bp-ink:#e3edf8; --bp-con:#e3edf8;
  --bp-grid:rgba(227,237,248,.085); --bp-grid-b:rgba(227,237,248,.15);
  --bp-fill:#122a45; --bp-wall:#17324f;
  /* ILLUMINATION. On a portrait screen a deep zoom into a wide drawing is
     awkward, so lighting an object in place has to carry what the zoom carries on
     desktop. It also gives the copy panel and the drawing a SHARED LIGHT SOURCE,
     which is the thing that stops them reading as two separate worlds. */
  --lit-line:#c4f3fc; --glow-1:rgba(120,224,240,.50); --glow-2:rgba(120,224,240,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--bp-ink);
     line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---- the pinned drawing --------------------------------------------------
   The stage sticks for the whole scroller; the copy is pulled back over it with
   a negative margin so sections travel across the drawing instead of after it. */
#scroller{position:relative}
#stage-wrap{position:sticky;top:0;height:100vh;display:grid;place-items:center;
            overflow:hidden;z-index:1}
#stage{display:block;width:min(100%,1700px);height:auto}
#copy{position:relative;z-index:2;margin-top:-100vh;pointer-events:none}
#copy section{min-height:100vh;display:flex;align-items:center;padding:0 clamp(20px,6vw,90px)}
/* The copy panel is a piece of the drawing sheet laid on the navy, not a UI card:
   square corners, a double rule the way a sheet frames a detail view, and a
   header field carrying the item reference. It is meant to read as one more
   annotation on the blueprint. */
#copy .card{pointer-events:auto;max-width:47ch;position:relative;
            /* 94% rather than solid, so the sheet grid whispers through and the
               panel reads as part of the drawing instead of floating over it. This
               part is not light-dependent, so it holds on desktop too — a first
               move on the two-worlds problem, not the whole answer. */
            background:rgba(242,245,249,.94);backdrop-filter:blur(3px);
            border:1px solid var(--rule);
            box-shadow:0 24px 56px -20px rgba(0,0,0,.62);
            padding:26px 30px 24px;color:var(--card-ink-2)}
#copy .card::before{content:"";position:absolute;inset:5px;
                    border:1px solid var(--rule-2);pointer-events:none}
#copy .card > *{position:relative}
#copy section:nth-child(even) .card{margin-left:auto}
.tag{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
     padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--rule-2)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;
         color:var(--card-ink);opacity:.72}
.ref{font-family:var(--mono);font-size:10px;letter-spacing:.12em;white-space:nowrap;
     color:var(--card-ink);opacity:.42}
.card h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(23px,2.9vw,35px);line-height:1.12;
         letter-spacing:-.015em;font-weight:600;margin:0 0 10px;color:var(--card-ink)}
.card p{font-size:15px;color:var(--card-ink-2)}
.card .beat{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--card-ink);
            opacity:.5;margin-top:15px;padding-top:12px;border-top:1px solid var(--rule-2)}
.card em{font-style:normal;background:linear-gradient(transparent 62%,rgba(245,197,24,.55) 62%)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lnk{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-decoration:none;
     color:var(--card-ink);border:1px solid var(--rule-2);background:transparent;
     padding:7px 11px;cursor:pointer;transition:background 180ms,border-color 180ms}
.lnk:hover{background:var(--card-ink);color:var(--paper);border-color:var(--card-ink)}

/* Deep content is a disclosure for now. It is REAL content that works, rather than
   a button that pretends to open something — the object-mapped dialog replaces it,
   and until then nothing here is a promise the page cannot keep. */
.deep{margin-top:15px;border-top:1px solid var(--rule-2);padding-top:12px}
.deep summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
              cursor:pointer;color:var(--card-ink);opacity:.8;list-style:none}
.deep summary::-webkit-details-marker{display:none}
.deep summary::after{content:" +";opacity:.6}
.deep[open] summary::after{content:" –"}
.deep dl{margin:12px 0 0;display:grid;gap:9px}
.deep dt{font-size:13px;font-weight:600;color:var(--card-ink)}
.deep dd{margin:1px 0 0;font-size:13px;line-height:1.5;color:var(--card-ink-2)}
.deep .dnote{margin-top:11px;font-size:12.5px;color:var(--card-ink-2)}
.deep .dnote a{color:var(--card-ink)}

/* ---- the drawing language ---------------------------------------------- */
.art{fill:none;stroke:var(--bp-ink);stroke-linejoin:miter;stroke-linecap:butt;
     shape-rendering:geometricPrecision}
.art .ol {stroke-width:var(--w-ol)}
.art .vis{stroke-width:var(--w-vis)}
/* held-back weights need MORE opacity on a dark ground than on white — a faint
   light line disappears into navy far faster than a faint dark line does on paper */
.art .hid{stroke-width:var(--w-hid);stroke-dasharray:9 6;opacity:.50}
.art .con{stroke-width:var(--w-con);stroke:var(--bp-con);opacity:.46}
.art .cen{stroke-width:var(--w-con);stroke:var(--bp-con);stroke-dasharray:30 6 4 6;opacity:.38}
.art .solid{fill:var(--bp-fill);stroke:none}
.art #wall{fill:var(--bp-wall);stroke:none}
.art *{vector-effect:non-scaling-stroke}
.art .colstroke{stroke:var(--bp-con)}

/* Screen copy: faint white on navy at rest, dark on the lit screen — because at
   rest the display has no fill and the navy ground shows through it. */
.art .scr{font-family:var(--mono);fill:var(--bp-ink);opacity:.42;stroke:none;
          transition:fill 600ms ease,opacity 600ms ease}
.art .scr-h{letter-spacing:.13em}
.art .scr-k{font-weight:500}
.obj.lit .scr{fill:#173254;opacity:1}
.obj.lit .scr-v{opacity:.78}
.art .col{fill:none;transition:fill 600ms ease}
.art .colstroke{transition:stroke 600ms ease,opacity 600ms ease}
.obj.lit .col{fill:var(--c)}
.obj.lit .colstroke{stroke:var(--c);opacity:1}

/* GLOW IS PORTRAIT-ONLY.
   On a phone an object is a few hundred pixels across and a colour fill barely
   registers, so light has to carry the focus. On desktop the fill is large enough
   to do that on its own, and adding a bloom there would only be decoration — plus
   it keeps the drop-shadow filter out of the animated tree at the zoom levels where
   it would cost the most.
   760px matches the breakpoint scene.js uses to switch to the portrait shot list,
   so illumination and the mobile framing arrive together rather than independently. */
@media (max-width:760px){
  .art .obj{transition:filter 700ms ease}
  .obj.lit{filter:drop-shadow(0 0 4px var(--glow-1)) drop-shadow(0 0 14px var(--glow-2))}
  .obj.lit .ol,.obj.lit .vis{stroke:var(--lit-line);transition:stroke 700ms ease}
  .obj.lit .con,.obj.lit .cen{stroke:var(--lit-line);opacity:.6}
  .no-glow .obj.lit{filter:none}
  /* the panel only borrows the cyan light where there IS cyan light to borrow */
  #copy .card{box-shadow:0 24px 56px -20px rgba(0,0,0,.62),
                         0 0 0 1px rgba(120,224,240,.16),
                         0 0 48px -8px rgba(120,224,240,.18)}
}

/* layers get their own transform for parallax; will-change keeps them composited */
#L-room,#L-wall,#L-back,#L-front,#L-fg{will-change:transform}
#camg{will-change:transform}

.sheet{fill:none;stroke:var(--bp-ink);shape-rendering:geometricPrecision;opacity:.9}
.sheet *{vector-effect:non-scaling-stroke}
.sh-bg{fill:var(--bp-ground);stroke:none}
.sh-frame{stroke-width:2.2;fill:none}
.sh-line{stroke-width:1.1;fill:none}
.sh-cen{stroke-width:1;stroke:var(--bp-con);stroke-dasharray:16 4 3 4;fill:none;opacity:.34}
.sh-arrowfill{fill:var(--bp-ink);stroke:none}
.sh-k{fill:var(--bp-con);stroke:none;font-family:var(--mono);font-size:13px;letter-spacing:.12em;opacity:.58}
.sh-v{fill:var(--bp-ink);stroke:none;font-family:var(--mono);font-size:16px}
.sh-title{fill:var(--bp-ink);stroke:none;font-family:var(--mono);font-size:22px;letter-spacing:.1em}
.sh-zone{fill:var(--bp-con);stroke:none;font-family:var(--mono);font-size:15px;opacity:.5}

/* ---- fixed chrome: progress rail and a live read-out ------------------- */
#rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:5;
      display:flex;flex-direction:column;gap:9px}
#rail button{width:26px;height:26px;border-radius:3px;border:1px solid rgba(227,237,248,.3);
             background:rgba(18,42,69,.55);font-family:var(--mono);font-size:10px;
             color:var(--bp-ink);cursor:pointer;display:grid;place-items:center;padding:0}
#rail button:hover{border-color:rgba(227,237,248,.7)}
#rail button[aria-current="true"]{background:var(--bp-ink);color:var(--navy);border-color:var(--bp-ink)}
#hud{position:fixed;left:18px;bottom:16px;z-index:5;font-family:var(--mono);font-size:10.5px;
     letter-spacing:.05em;color:var(--bp-ink);opacity:.5}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--sun);z-index:6;width:0}
@media (max-width:760px){#rail{display:none}}
</style>
</head>
<body>

<div id="bar"></div>

<div id="scroller">
  <div id="stage-wrap"><svg id="stage" aria-label="The desk — one drawing, eight shots"></svg></div>
  <div id="copy"></div>
</div>

<nav id="rail" aria-label="shots"></nav>
<div id="hud"></div>

<script type="module">
import { mountScene } from './assets/scene/scene.js';
import { sheetFurniture, BOM } from './assets/scene/sheet.mjs';
import { SHOTS } from './assets/scene/shots.js';
import { SECTIONS } from './assets/scene/content.js';

const pad = n => String(n).padStart(2, '0');
const external = h => /^(https?:|mailto:)/.test(h);

const linkHTML = l => l.shot !== undefined
  ? `<button class="lnk" data-goto="${l.shot}">${l.label}</button>`
  : `<a class="lnk" href="${l.href}"${l.download ? ' download' : ''}` +
    `${external(l.href) ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a>`;

const deepHTML = d => `<details class="deep">
  <summary>${d.label}</summary>
  <dl>${d.items.map(i => `<dt>${i.k}</dt><dd>${i.v}</dd>`).join('')}</dl>
  ${d.note ? `<p class="dnote">${d.note}${d.link
    ? ` <a href="${d.link.href}">${d.link.label} →</a>` : ''}</p>` : ''}
</details>`;

/* One viewport per shot, in the shot list's own order. The header field carries the
   sheet reference so the panel reads as part of the drawing rather than an overlay
   that happens to sit on top of it. */
document.getElementById('copy').innerHTML = SHOTS.map(s => {
  const sec = SECTIONS[s.id] || {};
  const c = sec.panel;
  if (!c) return `<section data-shot="${s.n}"></section>`;
  return `<section data-shot="${s.n}">
    <div class="card">
      <div class="tag">
        <span class="eyebrow">${c.eyebrow}</span>
        <span class="ref">SK-01 · ${pad(s.n)}/${pad(SHOTS.length)}</span>
      </div>
      <h2>${c.head}</h2>
      <p>${c.body}</p>
      ${c.links ? `<div class="links">${c.links.map(linkHTML).join('')}</div>` : ''}
      ${sec.deep ? deepHTML(sec.deep) : ''}
    </div>
  </section>`;
}).join('');

/* The devices in the drawing display the actual content, at full length. A list of
   headlines reads as thin, and thin does not earn anyone's trust — so the six audit
   steps are ON the monitor, readable once the camera arrives, rather than trimmed
   to a summary in the panel. */
const cam = mountScene(document.getElementById('stage'), {
  sheet: sheetFurniture(2400, 1500),
  copy: { monitor: SECTIONS.method.deep }
});
window.__cam = cam;   // so the camera can be driven and inspected from the console

/* rail */
const rail = document.getElementById('rail');
rail.innerHTML = SHOTS.map(s => `<button data-n="${s.n}" title="${s.title}">${s.n}</button>`).join('');
rail.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) cam.goTo(+b.dataset.n);
});

/* in-panel buttons that fly the camera to another shot */
document.getElementById('copy').addEventListener('click', e => {
  const b = e.target.closest('[data-goto]');
  if (b) cam.goTo(+b.dataset.goto);
});

const bar = document.getElementById('bar');
const hud = document.getElementById('hud');
const btns = [...rail.querySelectorAll('button')];

cam.onShot((near, p) => {
  btns.forEach(b => b.setAttribute('aria-current', +b.dataset.n === near + 1));
  bar.style.width = (p / (SHOTS.length - 1) * 100).toFixed(2) + '%';
  const s = cam.stats();
  hud.textContent = `SHOT ${near + 1}/${SHOTS.length} · ${SHOTS[near].title.toUpperCase()} · `
    + `${s.drawn}/${s.objects} OBJECTS DRAWN · ${s.paths} PATHS`;
});
</script>
</body>
</html>
