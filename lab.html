<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>M3 · The Desk — scroll-driven camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* ARCHIVAL PAGE — navy line on warm paper, with brass as the single accent.
     One ground, everywhere. The previous scheme was a reversed print (white line on
     navy) and it worked, but it forced the copy onto a separate white card that read
     as a different world from the drawing. On one warm ground the panel is a lighter
     leaf of the SAME paper, so the seam that kept showing up simply is not there.

     Brass replaces the yellow. Yellow at full chroma on cream goes acid and pulls
     harder than the linework it is meant to punctuate; brass is the same idea with
     the volume down, and it belongs to the drafting-instrument world the page is
     already borrowing from. Used only for accents — never for body text, where it
     could not hold 4.5:1 on paper. */
  --ink:#1e3a5f; --ink-deep:#12294a;
  --paper:#faf7f0; --rule:#1e3a5f; --rule-2:#ded4c0;
  --card-ink:#17293f; --card-ink-2:#55606d;
  --brass:#a97e2f; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  /* UNIFIED LINE WEIGHT. Dark line on paper does not bloom the way light line on navy
     does, so every weight comes down AND closes up: the outline was 2.1 against a 0.9
     construction line, more than 2x, which made objects read as bold cartoon outlines
     with faint scaffolding inside. Held within a third of each other they read as one
     drawing made with one pen. */
  --w-ol:1.5; --w-vis:1.15; --w-hid:0.95; --w-con:0.85;
  --bp-ground:#ece6d8; --bp-ink:#28486e; --bp-con:#28486e;
  --bp-grid:rgba(30,58,95,.075); --bp-grid-b:rgba(30,58,95,.14);
  /* --bp-fill MUST equal --bp-ground: it is the occluding fill that hides the linework
     behind a solid object, so any difference paints a visible silhouette block. */
  /* DEPTH BY VALUE, the way the navy scheme had it. Each plane of the room takes a slightly
     different tone as it turns away from the light, which is what gave that version its sense of
     a room rather than a flat elevation.
     The first attempt at this on paper failed and the reason was the SIZE of the step, not the
     idea: four values apart on navy is invisible, and on cream it drew a hard join across the
     sheet. These are two and four steps — enough to separate the planes, not enough to read as
     an edge between two different papers.
     --bp-fill must stay EXACTLY --bp-ground: it is the occluding fill that hides linework behind
     a solid object, so any difference paints a visible silhouette block. */
  --bp-fill:#ece6d8; --bp-wall:#eae3d3; --bp-case:#e6dfce;
  /* ILLUMINATION. On a portrait screen a deep zoom into a wide drawing is awkward, so
     lighting an object in place has to carry what the zoom carries on desktop.
     On paper "lit" cannot mean a bright line — there is nothing brighter than the
     ground. So it means the ink goes to full strength while the rest of the drawing
     stays a wash, and the bloom is brass rather than cyan: warm light in a vitrine,
     and the same light the panel is lit by. */
  --lit-line:#12294a; --glow-1:rgba(169,126,47,.42); --glow-2:rgba(169,126,47,.16);
  /* Surfaces and shadows, tokenised because the theme flip found the same four literal
     colours copied into eight rules — every one of which had to be hunted down by hand. */
  --panel:rgba(250,247,240,.94);          /* the copy panel: a lighter leaf of the ground */
  --panel-2:rgba(250,247,240,.96);
  --lift:0 18px 40px -18px rgba(30,58,95,.22);     /* paper lifting off paper, not a hole */
  --lift-2:0 26px 58px -22px rgba(30,58,95,.26);
  --mark-hl:rgba(169,126,47,.30);         /* the marker pen under an emphasised word */
  --chip:rgba(250,247,240,.78); --chip-br:rgba(30,58,95,.26);
  --scrim:rgba(24,38,58,.42);              /* dims the drawing so the dialog is the page */
  --halo:rgba(30,58,95,.13); --halo-2:rgba(30,58,95,.085); --halo-3:rgba(30,58,95,.055);
  /* Footer grid pitch. The script measures the real one from the stage; this is the fallback so
     the texture is still there with no JavaScript. */
  --gp:23.4px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* ANCHOR, THEN JUMP. Each panel is a snap point, so a scroll that ends near one settles ON it
   — the reader is taught to stop there and read — and the next flick delivers the following
   panel in one action instead of leaving them parked between two.

   This is the right layer for it. The ask was about how far the page travels per scroll, which
   CSS cannot set directly, but snapping produces the effect: resistance at the anchor, then
   the next card arrives whole. It also leaves the camera free to keep moving continuously,
   so the pause comes from the SCROLL and the flow from the CAMERA — rather than the camera
   having to sit dead still to manufacture a pause, which is what made it lurch before.

   `proximity`, not `mandatory`: sections with deep content are taller than the viewport, and
   mandatory snapping fights a reader trying to rest halfway down one. Easy to make stronger
   if the pull turns out too gentle. */
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
#copy section{scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* NO overflow-x:hidden here. Setting overflow on html or body makes it the scroll container,
   which breaks position:sticky on every descendant — it is what un-pinned the desk. The
   circle is drawn as gradients inside a viewport-sized element instead, so nothing is
   oversized and there is no horizontal overflow to suppress in the first place. */
/* --bp-ground, NOT --paper. The page and the drawing have to be the same sheet. With the
   body on the lighter panel white and the stage on the cream, the drawing sat in a visibly
   different tone from the page around it and the stage's own edge became a seam — the exact
   "two worlds" problem, reintroduced by the theme flip in a new place. --paper is one step
   lighter and belongs to the panels, which is what makes them read as a leaf laid on top. */
body{font-family:'Inter',system-ui,sans-serif;background:var(--bp-ground);color:var(--card-ink);
     line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---- the pinned drawing --------------------------------------------------
   The stage sticks for the whole scroller; the copy is pulled back over it with
   a negative margin so sections travel across the drawing instead of after it. */
#scroller{position:relative}
#stage-wrap{position:sticky;top:0;height:100vh;display:grid;place-items:center;
            overflow:hidden;z-index:1}
#stage{display:block;width:min(100%,1700px);height:auto}
#copy{position:relative;z-index:2;margin-top:-100vh;pointer-events:none}
/* min-height, not height: a section with six sub-items grows past the viewport and
   the page simply gets longer. That is the capacity fix — no copy is trimmed to fit a
   screen any more, and the camera holds still while you read it. */
#copy section{min-height:100vh;display:flex;align-items:center;
              padding:13vh clamp(20px,6vw,90px)}
/* The copy panel is a piece of the drawing sheet laid on the navy, not a UI card:
   square corners, a double rule the way a sheet frames a detail view, and a
   header field carrying the item reference. It is meant to read as one more
   annotation on the blueprint. */
#copy .card{pointer-events:auto;width:min(56ch,46vw);max-width:100%;position:relative;
            /* 94% rather than solid, so the sheet grid whispers through and the
               panel reads as part of the drawing instead of floating over it. This
               part is not light-dependent, so it holds on desktop too — a first
               move on the two-worlds problem, not the whole answer. */
            background:var(--panel);backdrop-filter:blur(3px);
            border:1px solid var(--rule);
            box-shadow:var(--lift);
            padding:26px 30px 24px;color:var(--card-ink-2)}
#copy .card::before{content:"";position:absolute;inset:5px;
                    border:1px solid var(--rule-2);pointer-events:none}
#copy .card > *{position:relative}
/* PANELS ALTERNATE, driven by the shot's own `side`. Pinning them all to one side did fix
   the collisions, but it cost the thing the collisions were in service of: with the reading
   position never moving, eight shots read as a list of boxes down the left margin however
   much the drawing travelled. The camera's horizontal bias now mirrors this, so each side
   has its own clear zone instead of one side having all of them. */
#copy section{position:relative}
#copy section[data-side="r"]{justify-content:flex-end}
#copy section[data-side="c"]{justify-content:center}
#copy section[data-side="c"] .card{text-align:center}
#copy section[data-side="c"] .tag,#copy section[data-side="c"] .links{justify-content:center}

/* THE LAST CARD IS THE FOOTER: the same sheet-of-paper panel as every other section, but running
   the full width of the window and sitting at the bottom. That makes it the end of the page —
   which is why the separate closing section below it is gone. It had been bare words over a
   blurred scene; a full-width card carries its own legibility, so the wash and its blur go with
   it. Everything the closing beat said is now the `close` line inside this card. */
#copy section[data-side="b"]{align-items:flex-end;justify-content:center;text-align:center;
                             padding:0 0 0 0}
/* The MASK is what makes this work. backdrop-filter is clipped to the element's box, so a
   fading background over a blurred box still leaves the blur ending on a hard horizontal line
   straight across the drawing. Masking the element fades the blur itself out, so the effect
   arrives gradually and there is no edge to see. */
/* THE FOOTER IS A TECHNICAL LEGEND PRINTED ON THE SHEET, not a card resting on it.
   It was the panel paper (#faf7f0) — a lighter value than the drawing's ground — so however
   wide it ran it still announced itself as a separate surface, and the join at its top edge was
   the abrupt jump. Three things fix that, and they have to go together:

     · the exact canvas value, so there is no step at all
     · the grid carried through it, so the texture does not stop where the drawing does
     · navy linework and mono labels, so it reads as the sheet's legend block

   `--gp` is the grid pitch in pixels, set from the stage's real rendered width by the script —
   the drawing's grid is 40 user units on a 2400-unit sheet, so the pitch depends on how wide the
   SVG actually is. A hard-coded value would line up at one window size and drift at every other. */
#copy section[data-side="b"] .card{width:100%;max-width:none;padding:34px clamp(20px,6vw,90px) 30px;
    border-left:0;border-right:0;border-bottom:0;border-top:1px solid var(--bp-ink);
    box-shadow:none;backdrop-filter:none;
    background-color:var(--bp-ground);
    background-image:
      repeating-linear-gradient(to right,var(--bp-grid) 0 1px,transparent 1px var(--gp)),
      repeating-linear-gradient(to bottom,var(--bp-grid) 0 1px,transparent 1px var(--gp)),
      repeating-linear-gradient(to right,var(--bp-grid-b) 0 1.6px,transparent 1.6px calc(var(--gp) * 5)),
      repeating-linear-gradient(to bottom,var(--bp-grid-b) 0 1.6px,transparent 1.6px calc(var(--gp) * 5))}
/* the inner rule a title block carries, top edge only — the sheet continues below */
#copy section[data-side="b"] .card::before{left:0;right:0;top:6px;bottom:auto;height:0;
    border-left:0;border-right:0;border-bottom:0;border-top:1px solid var(--bp-ink);opacity:.34}
#copy section[data-side="b"] .card p{max-width:62ch;margin-inline:auto}
#copy section[data-side="b"] .card .tag{max-width:none;border-bottom-color:var(--bp-ink);
    opacity:.85}
/* Links become instrument boxes: a single navy hairline, mono, no fill until you touch them. */
#copy section[data-side="b"] .lnk{border-color:var(--bp-ink);color:var(--bp-ink);opacity:.9}
#copy section[data-side="b"] .lnk:hover{background:var(--bp-ink);color:var(--bp-ground);opacity:1}
#copy section[data-side="b"] .card h2,#copy section[data-side="b"] .cl{color:var(--bp-ink)}
#copy section[data-side="b"] .cl{border-top-color:var(--bp-ink);border-top-style:solid}
#copy section[data-side="b"] .tag{justify-content:center;border-bottom:0;margin-bottom:8px}
#copy section[data-side="b"] .links{justify-content:center;margin-top:20px}
#copy section[data-side="b"] .card h2{font-size:clamp(26px,3.6vw,44px)}
#copy section[data-side="b"] .card p{font-size:16px;max-width:52ch;margin:0 auto}
.tag{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
     padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--rule-2)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;
         color:var(--card-ink);opacity:.72}
.ref{font-family:var(--mono);font-size:10px;letter-spacing:.12em;white-space:nowrap;
     color:var(--card-ink);opacity:.42}
.card h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(23px,2.9vw,35px);line-height:1.12;
         letter-spacing:-.015em;font-weight:600;margin:0 0 10px;color:var(--card-ink)}
.card p{font-size:15px;color:var(--card-ink-2)}
.card .beat{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--card-ink);
            opacity:.5;margin-top:15px;padding-top:12px;border-top:1px solid var(--rule-2)}
.card em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark-hl) 62%)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lnk{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-decoration:none;
     color:var(--card-ink);border:1px solid var(--rule-2);background:transparent;
     padding:7px 11px;cursor:pointer;transition:background 180ms,border-color 180ms}
.lnk:hover{background:var(--card-ink);color:var(--paper);border-color:var(--card-ink)}

/* Deep content is a disclosure for now. It is REAL content that works, rather than
   a button that pretends to open something — the object-mapped dialog replaces it,
   and until then nothing here is a promise the page cannot keep. */
.deep{margin-top:16px;border-top:1px solid var(--rule-2);padding-top:14px}
.deep dl{margin:0;display:grid;gap:2px}
.deep dt+dt,.deep dd+dt{margin-top:13px}
.deep dt{font-size:13px;font-weight:600;color:var(--card-ink)}
.deep dd{margin:1px 0 0;font-size:13px;line-height:1.5;color:var(--card-ink-2)}
.deep .dnote{margin-top:11px;font-size:12.5px;color:var(--card-ink-2)}
.deep .dnote a{color:var(--card-ink)}
.deep .dtitle{margin:11px 0 0;font-size:13.5px;font-weight:600;color:var(--card-ink)}
.deep .dmeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
             color:var(--card-ink);opacity:.55;margin-top:6px}
.deep .drole{font-size:12px;color:var(--card-ink);opacity:.75;margin-top:1px}
.deep .dlearn{font-size:12.5px;font-style:italic;color:var(--card-ink-2);margin-top:3px}
/* the three ridge lessons — what trekking taught her, which is the only thing that
   turns the travel section from a hobby into an argument about her judgement */
.lessons{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.lessons li{font-size:13.5px;line-height:1.45;color:var(--card-ink);padding-left:15px;
            position:relative}
.lessons li::before{content:"—";position:absolute;left:0;opacity:.45}

/* ---- the drawing language ---------------------------------------------- */
/* Nothing in the drawing is text to be selected, and a blue selection flash or a grey
   tap rectangle over a blueprint reads as a bug rather than as feedback. */
#stage,#stage *{user-select:none;-webkit-user-select:none;
                -webkit-tap-highlight-color:transparent}
#stage *:focus{outline:none}

.art{fill:none;stroke:var(--bp-ink);stroke-linejoin:miter;stroke-linecap:butt;
     shape-rendering:geometricPrecision}
.art .ol {stroke-width:var(--w-ol)}
.art .vis{stroke-width:var(--w-vis)}
/* held-back weights need MORE opacity on a dark ground than on white — a faint
   light line disappears into navy far faster than a faint dark line does on paper */
.art .hid{stroke-width:var(--w-hid);stroke-dasharray:9 6;opacity:.50}
.art .con{stroke-width:var(--w-con);stroke:var(--bp-con);opacity:.46}
.art .cen{stroke-width:var(--w-con);stroke:var(--bp-con);stroke-dasharray:30 6 4 6;opacity:.38}
.art .solid{fill:var(--bp-fill);stroke:none}
.art #wall{fill:var(--bp-wall);stroke:none}
/* The case planes take the light differently as they turn away from the viewer — back wall
   lightest, sides darker — which is what gives the room depth rather than reading as a flat
   elevation. Filled again after being switched off: the problem was the step size, not the
   shading. Portrait still drops them, because there the fills fought the page background and
   chopped the halo circle. */
.art .casewall{fill:var(--bp-case);stroke:none}
/* the halo sets its own per-ring opacity inline, so it needs to escape .con's */
.art .halo{fill:none;opacity:1;stroke-width:1.6}
.art *{vector-effect:non-scaling-stroke}
.art .colstroke{stroke:var(--bp-con)}
/* NO LEVEL-OF-DETAIL HIDING. This used to drop the mesh isolines, hidden lines and centre
   lines while the camera moved, which cut slow frames from 52 to 21 over a full traverse —
   a real measurement and a real gain. It is gone anyway, because she watched the page and
   saw the fine lines on the figure BLINK. A frame-rate win that the reader perceives as the
   drawing flickering is not a win; the flicker is more damaging than the jank it bought.
   `data-moving` is still set on the stage — it is a fact about the camera worth having — but
   nothing keys off it visually any more. */

/* Screen copy: faint white on navy at rest, dark on the lit screen — because at
   rest the display has no fill and the navy ground shows through it. */
.art .scr{font-family:var(--mono);fill:var(--bp-ink);opacity:.42;stroke:none;
          transition:fill 600ms ease,opacity 600ms ease}
.art .scr-h{letter-spacing:.13em}
.art .scr-k{font-weight:500}
.art .scr-n{font-style:italic}
.obj.lit .scr-n{opacity:.72}
.obj.lit .scr{fill:var(--ink-deep);opacity:1}
.obj.lit .scr-v{opacity:.78}

/* the monitor's two screen states — dashboard normally, the document at Method */
.scr-dash,.scr-doc{transition:opacity 550ms ease}
.scr-doc{opacity:0;pointer-events:none}
#stage[data-shot="method"] .scr-dash{opacity:0}
#stage[data-shot="method"] .scr-doc{opacity:1}
.art .col{fill:none;transition:fill 600ms ease}
.art .colstroke{transition:stroke 600ms ease,opacity 600ms ease}
.obj.lit .col{fill:var(--c)}
.obj.lit .colstroke{stroke:var(--c);opacity:1}

/* GLOW IS PORTRAIT-ONLY.
   On a phone an object is a few hundred pixels across and a colour fill barely
   registers, so light has to carry the focus. On desktop the fill is large enough
   to do that on its own, and adding a bloom there would only be decoration — plus
   it keeps the drop-shadow filter out of the animated tree at the zoom levels where
   it would cost the most.
   760px matches the breakpoint scene.js uses to switch to the portrait shot list,
   so illumination and the mobile framing arrive together rather than independently. */
@media (max-width:900px){
  .art .obj{transition:filter 700ms ease}
  .obj.lit{filter:drop-shadow(0 0 4px var(--glow-1)) drop-shadow(0 0 14px var(--glow-2))}
  .obj.lit .ol,.obj.lit .vis{stroke:var(--lit-line);transition:stroke 700ms ease}
  .obj.lit .con,.obj.lit .cen{stroke:var(--lit-line);opacity:.6}
  .no-glow .obj.lit{filter:none}
  /* the panel only borrows the cyan light where there IS cyan light to borrow */
  #copy .card{box-shadow:var(--lift-2),
                         0 0 0 1px rgba(169,126,47,.22),
                         0 0 44px -8px rgba(169,126,47,.20)}
}

/* HOVER — the desk should feel touchable rather than printed.
   The lift is a transition rather than a keyframe loop on purpose: an infinite bob
   cut off by mouse-out snaps back, whereas a transition eases out from wherever it
   got to. The curve is the same expressive one the dialog spec calls for. */
.hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
.obj .ob{transition:transform 440ms cubic-bezier(.16,1,.3,1);
         transform-box:fill-box;transform-origin:50% 100%}
.obj:hover .ob{transform:translateY(-11px) scale(1.014) rotate(-.35deg)}
@media (prefers-reduced-motion:reduce){
  .obj .ob{transition:none}
  .obj:hover .ob{transform:none}
}

/* layers get their own transform for parallax; will-change keeps them composited */
#L-room,#L-wall,#L-back,#L-front,#L-fg{will-change:transform}
#camg{will-change:transform}

.sheet{fill:none;stroke:var(--bp-ink);shape-rendering:geometricPrecision;opacity:.9}
.sheet *{vector-effect:non-scaling-stroke}
.sh-bg{fill:var(--bp-ground);stroke:none}
.sh-frame{stroke-width:2.2;fill:none}
.sh-line{stroke-width:1.1;fill:none}
.sh-cen{stroke-width:1;stroke:var(--bp-con);stroke-dasharray:16 4 3 4;fill:none;opacity:.34}
.sh-arrowfill{fill:var(--bp-ink);stroke:none}
.sh-k{fill:var(--bp-con);stroke:none;font-family:var(--mono);font-size:13px;letter-spacing:.12em;opacity:.58}
.sh-v{fill:var(--bp-ink);stroke:none;font-family:var(--mono);font-size:16px}
.sh-title{fill:var(--bp-ink);stroke:none;font-family:var(--mono);font-size:22px;letter-spacing:.1em}
.sh-zone{fill:var(--bp-con);stroke:none;font-family:var(--mono);font-size:15px;opacity:.5}

/* ---- the parts list is navigation ---------------------------------------
   A row lights the same accent its section uses, so hovering item 05 tells you
   the map and the travel chapter are the same thing before you click. `.bomhit`
   is a transparent band, not a filled one: it must catch the pointer across the
   whole row without painting over the rule lines. */
.bomrow{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bomrow .sh-v{transition:fill .16s ease}
.bomhit{fill:transparent;stroke:none}
.bomlit{fill:var(--lit-line);stroke:none;opacity:0;transition:opacity .16s ease}
.bomrow:hover .bomlit,.bomrow:focus-visible .bomlit{opacity:.12}
.bomrow:hover .sh-v,.bomrow:focus-visible .sh-v{fill:var(--lit-line)}
.bomrow:focus{outline:none}
.bomrow:focus-visible .bomhit{stroke:var(--lit-line);stroke-width:1.6}
/* the row for the section you are currently in stays marked, so the table doubles as
   a position read-out — the same job the rail does, in the drawing's own language */
.bomrow.here .bomlit{opacity:.09}
.bomrow.here .sh-v{fill:var(--lit-line)}
@media (prefers-reduced-motion:reduce){.bomlit,.bomrow .sh-v{transition:none}}

/* ---- fixed chrome: progress rail and a live read-out ------------------- */
#rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:5;
      display:flex;flex-direction:column;gap:9px}
#rail button{width:26px;height:26px;border-radius:3px;border:1px solid var(--chip-br);
             background:var(--chip);font-family:var(--mono);font-size:10px;
             color:var(--bp-ink);cursor:pointer;display:grid;place-items:center;padding:0}
#rail button:hover{border-color:var(--bp-ink)}
#rail button[aria-current="true"]{background:var(--bp-ink);color:var(--paper);border-color:var(--bp-ink)}
#hud{position:fixed;left:18px;bottom:16px;z-index:5;font-family:var(--mono);font-size:10.5px;
     letter-spacing:.05em;color:var(--bp-ink);opacity:.5}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--brass);z-index:6;width:0}
#rail button{gap:0}
.rl{display:none}
#rail button:hover .rl,#rail button[aria-current="true"] .rl{display:inline;
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;white-space:nowrap;padding:0 8px}
#rail button:hover,#rail button[aria-current="true"]{width:auto;min-width:26px;
    padding:0 2px 0 0;justify-content:flex-start}
#rail button:hover .rn,#rail button[aria-current="true"] .rn{padding-left:8px}

/* ---- the warm close, inside the last card -------------------------------
   It had a full-height section of its own below the drawing, which read as the page stopping and
   then starting again. Folded into the footer card it is the final line of the page instead. Set
   in the serif at display size because it is the last thing anyone reads, with the same marker
   under the emphasised words as every other panel so the gesture belongs to the page. */
.cl{font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:clamp(19px,2.1vw,27px);line-height:1.22;letter-spacing:-.015em;
    color:var(--card-ink);margin:22px auto 0;max-width:48ch;
    padding-top:18px;border-top:1px solid var(--rule-2)}
.cl em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark-hl) 62%)}

/* Footer — v1's last line landed back on "control and chaos", closing the loop the
   hero opens. It sits after the final section rather than fixed, so it reads as an end. */
/* card-ink-2 at FULL opacity: 5.1:1 on the paper ground. I estimated .62 opacity would give
   4.9 and it measured 3.99 — the contrast arithmetic changed completely when the ground did,
   and an opacity guess is not a measurement. Using the secondary ink token at opacity 1 means
   the value is one that has actually been checked, rather than one arrived at by dimming. */
#foot{position:relative;z-index:2;text-align:center;padding:8px 20px 46px;
      font-size:12.5px;color:var(--card-ink-2)}

/* Mobile navigation. The rail is hidden under 760px, so a phone previously had no way
   to reach any section at all — v1 had both a persistent bar and a named jump sheet. */
/* ---- the unifying circle ------------------------------------------------
   ONE circle rather than arcs clipped by a frame edge, sitting behind BOTH the copy panel
   and the drawing. That overlap is what joins them into a single composition instead of
   two stacked zones — which was the chopped feeling. Inner shadow, as in the reference. */
#halo{display:none}
@media (max-width:900px){
  /* The grid belongs to the whole page, not to the drawing's own band. As an svg rect it
     stopped where the drawing stopped, which put a visible horizon halfway down the screen
     — the same seam as the room fill. On the body it runs behind copy and desk alike. */
  body{background-image:
    repeating-linear-gradient(to right,var(--bp-grid) 0 1px,transparent 1px 42px),
    repeating-linear-gradient(to bottom,var(--bp-grid) 0 1px,transparent 1px 42px);
    background-attachment:fixed}
  .gridbg{display:none}

  /* Rings as radial gradients in a viewport-sized fixed layer. An oversized rounded div
     was the tidier idea but it overflowed the document sideways, and suppressing that
     overflow is what broke the sticky stage. Gradients cannot overflow anything. */
  #halo{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 46%, transparent 0 40.6%, var(--halo) 40.6% 41%, transparent 41%),
      radial-gradient(circle at 50% 46%, transparent 0 52.6%, var(--halo-2) 52.6% 53%, transparent 53%),
      radial-gradient(circle at 50% 46%, transparent 0 64.6%, var(--halo-3) 64.6% 65%, transparent 65%),
      radial-gradient(circle at 50% 46%, var(--halo-3) 0%, transparent 58%)}
}

/* ---- objects that own detail ------------------------------------------- */
/* A drafting callout marker. Something has to say the drawing is interactive; an
   interaction nobody can see is the same as not having one. */
/* Every object carries a plus, so any of them is a way into its section. Quiet by
   default; the ones that own a detail view fill in when their section is live, which is
   the only visual difference between "jump here" and "there is more here". */
.art .mark-r{fill:none;stroke:var(--bp-ink);stroke-width:1.3;opacity:.34}
.art .mark-p{fill:none;stroke:var(--bp-ink);stroke-width:1.5;opacity:.5}
/* Cue strokes come down with everything else — 3 and 4 were sized to survive being a
   light line on navy, and on paper they read as a heavy sticker on a fine drawing. */
.art .mark-r{stroke-width:2.1}
.art .mark-p{stroke-width:2.6}
.art .mark-t{fill:var(--bp-ink);stroke:none;font-family:var(--mono);font-size:62px;
             letter-spacing:.1em;opacity:.42}
.obj.tappable:hover .mark-t{opacity:.85}
.obj.lit.has-detail .mark-t{opacity:1;fill:var(--brass)}
.obj.tappable{cursor:pointer}
.obj.tappable:hover .mark-r,.obj.tappable:hover .mark-p{opacity:.9}
.obj.lit.has-detail .mark-r{opacity:1;fill:var(--brass);stroke:var(--brass)}
.obj.lit.has-detail .mark-p{stroke:var(--paper);opacity:1}
.mark{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:no-preference){
  .obj.lit.has-detail .mark{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}
}

/* ---- detail view ------------------------------------------------------- */
/* Built to the motion spec: the panel morphs out of the object that was tapped, the
   drawing behind it fades and scales DOWN so it reads as pushed back, and the rows
   unfold on a stagger. Closing reverses it, and a nudge of scroll is enough to trigger
   that — per the spec, a 20px delta. */
#det{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
     padding:max(18px,4vh) max(14px,4vw);background:var(--scrim);
     backdrop-filter:blur(3px)}
#det[hidden]{display:none}
#det-panel{position:relative;width:min(62ch,100%);max-height:88vh;overflow:auto;
           background:var(--paper);border:1px solid var(--rule);
           box-shadow:var(--lift-2);padding:26px 28px 24px;
           color:var(--card-ink-2)}
#det-panel::before{content:"";position:absolute;inset:5px;border:1px solid var(--rule-2);
                   pointer-events:none}
#det-panel > *{position:relative}
#det-x{position:absolute;right:9px;top:6px;width:34px;height:34px;border:0;
       background:transparent;font-size:24px;line-height:1;cursor:pointer;
       color:var(--card-ink);opacity:.55}
#det-x:hover{opacity:1}
#det h3{font-family:'Fraunces',Georgia,serif;font-size:clamp(21px,3.4vw,29px);line-height:1.15;
        font-weight:600;margin:0 0 14px;color:var(--card-ink)}
#det-body dl{margin:0;display:grid;gap:2px}
#det-body dt{font-size:14.5px;font-weight:600;color:var(--card-ink);margin-top:15px}
#det-body dd{margin:2px 0 0;font-size:14px;line-height:1.55;color:var(--card-ink-2)}
#det-body .dmeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
                 color:var(--card-ink);opacity:.55;margin-top:16px;font-weight:400}
#det-body .drole{font-size:12.5px;color:var(--card-ink);opacity:.75}
#det-body .dlearn{font-style:italic}
#det-body .dnote{margin-top:16px;padding-top:13px;border-top:1px solid var(--rule-2);
                 font-size:13.5px}
#det-body .dnote a{color:var(--card-ink)}
/* contact rows: real targets, not a list of links */
#det-body .contact{display:grid;gap:9px;margin-top:4px}
#det-body .crow{display:block;text-decoration:none;font-family:var(--mono);font-size:12.5px;
                letter-spacing:.05em;color:var(--card-ink);border:1px solid var(--rule-2);
                padding:15px 16px;transition:background 160ms,border-color 160ms}
#det-body .crow:hover{background:var(--card-ink);color:var(--paper);border-color:var(--card-ink)}
/* Satellites slide in staggered, but they are VISIBLE BY DEFAULT and animated from
   script. Gating them on a class hidden behind requestAnimationFrame meant content that
   only appeared if an animation frame landed — and a frame that never lands is content
   nobody can read. Fail-safe ordering: readable first, animated second. */
/* The drawing pushes back while the detail is open. Set from script rather than by a
   body class, so there is no cascade to lose an argument with.
   Note there is deliberately NO overflow lock: the spec wants a scroll GESTURE to trigger
   the close, and locking the scroll means no scroll event ever fires, so the gesture that
   was supposed to dismiss it did nothing at all. */
#stage-wrap{transition:transform 520ms cubic-bezier(.16,1,.3,1),opacity 520ms ease}
@media (prefers-reduced-motion:reduce){#stage-wrap{transition:none}}

/* ---- the stuck typewriter panel (portrait only) ------------------------- */
#tw{display:none}
@media (max-width:900px){
  /* tighter to the top edge, so the extra desk height comes out of dead space rather
     than out of the copy */
  #tw{display:block;position:fixed;left:14px;right:14px;top:4.5vh;z-index:4;
      background:var(--panel-2);border:1px solid var(--rule);
      box-shadow:var(--lift);padding:16px 18px 15px;
      color:var(--card-ink-2);min-height:31vh}
  #tw::before{content:"";position:absolute;inset:5px;border:1px solid var(--rule-2)}
  #tw > *{position:relative}
  #tw h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(20px,5.8vw,27px);line-height:1.14;
         letter-spacing:-.015em;font-weight:600;margin:0 0 9px;color:var(--card-ink);
         min-height:1.14em}
  #tw p{font-size:14px;margin:0;min-height:1.5em}
  /* say what the markers mean once, rather than hoping a glyph explains itself */
  #tw .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
            color:var(--card-ink);opacity:.45;margin-top:12px;padding-top:9px;
            border-top:1px solid var(--rule-2)}
  /* The untyped remainder holds its space but shows nothing. `visibility` rather than
     `opacity` or `color:transparent` because it also takes the text out of the accessibility
     tree, so a screen reader on the live region is not read a line twice. */
  #tw .off{visibility:hidden}
  /* The sign-off sits in a panel a third of the screen tall, so it takes the panel's scale
     rather than the display size it has inside the full-width footer card. */
  #tw .cl{font-size:15.5px;line-height:1.3;margin:14px 0 0;max-width:none;padding-top:12px}
  #tw .cl:empty{display:none}
  /* the caret only exists while something is actually being typed, and it goes on the TYPED
     span — on the parent it would land after the invisible remainder, a line away from the
     last letter written */
  #tw .caret .on::after{content:"";display:inline-block;width:.5ch;height:1em;
       margin-left:1px;background:var(--card-ink);vertical-align:-.12em;
       animation:blink .9s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
@media (prefers-reduced-motion:reduce){#tw .caret .on::after{animation:none}}

#mobar,#msheet{display:none}
/* the object carries this content on desktop; the panel must not repeat it */
@media (min-width:901px){ .deep.on-object{display:none} }

@media (max-width:900px){
  #rail{display:none}
  /* Portrait hides the scrolling cards entirely — the stuck panel carries the copy and
     the detail lives on the objects. The sections stay in the document as plain scroll
     spacers, one viewport each, which is what drives section progress and gives the
     type-out an even rhythm. */
  #copy .card{display:none}
  #copy section{min-height:100vh;padding:0}
  /* PORTRAIT LAYOUT: copy in the top two thirds, desk in the bottom third.
     Both were centred, so the card sat directly over the drawing and the desk was
     invisible. Pushing the stage to the bottom of the viewport and the copy to the top
     gives each its own band — which is also how her reference mock-up is composed. */
  /* The desk becomes an opaque FOREGROUND band and the copy scrolls behind it. With
     the copy on top, a long card (the six audit steps) simply overflowed into the
     bottom third and cut the drawing in half. Behind it, the band always reads as the
     desk and the text disappears into a soft fade at the boundary rather than being
     clipped — which is also how her mock-up is composed. */
  /* padding-bottom clears the fixed nav bar. Without it the drawing runs to the viewport
     floor and the chair's castors — the thing that makes it a whole chair — sat behind
     the bar. The svg is width-constrained so this moves it up rather than shrinking it. */
  #stage-wrap{place-items:end center;z-index:3;pointer-events:none;padding-bottom:64px}
  /* The masking gradient is gone. It existed to hide the scrolling copy behind the desk
     band, and on portrait the cards are hidden entirely — the stuck panel is separate. It
     was also covering the lower half of the unifying circle. */
  /* the svg arcs live inside the drawing's own frame, so they clip at its top edge —
     which is exactly the chopped look. #halo replaces them on portrait. */
  .art .halo{display:none}

  /* NO ROOM FILL ON PORTRAIT. The back wall and case planes are filled rectangles, so the
     drawing carried its own hard-edged background — a visibly different navy starting
     partway down the screen, which is what made it read as two setups pasted together and
     what kept chopping the circle. Dropping the fills lets the page's own navy run
     continuously behind both the copy and the desk, and the walls survive as edge lines.
     The .solid occlusion fills stay: they are the page navy, so they vanish against it
     while still hiding what is behind each object. */
  /* Kept as a belt-and-braces: on the archival ground the wall token equals the ground and
     the case planes are unfilled everywhere, so this is already true — but it states the
     requirement at the place the requirement was discovered. */
  .art #wall,.art .casewall{fill:none}

  /* the drawing-sheet furniture is a landscape conceit — on a phone it only produces
     half-sentences cropped at the frame edge */
  .sheet{display:none}
  /* Width derived from height, so the drawing cannot eat the whole screen on a tablet.
     The frame's aspect is 1720/1960, so a width of 55vh caps the height near 62vh. On a
     phone 55vh exceeds the viewport width, so min() falls back to full width. */
  #stage{width:min(100%,55vh);position:relative}
  #copy section{align-items:flex-start;padding:7vh 16px 46vh}
  #copy .card{width:100%;padding:20px 18px 18px}
  .card h2{font-size:clamp(21px,6.4vw,28px)}
  .card p,.deep dd,.lessons li{font-size:14px}
  .tag{gap:10px}
  .ref{font-size:9px}
  #mobar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:7;gap:8px}
  #mobar button{flex:1;border:1px solid var(--chip-br);border-radius:3px;cursor:pointer;
                font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:12px 8px;
                background:rgba(250,247,240,.94);color:var(--bp-ink);backdrop-filter:blur(6px)}
  #mobar .mb-s{background:var(--bp-ink);color:var(--paper);border-color:var(--bp-ink)}
  #mobar .mb-j{flex:0 0 46px;font-size:14px}
  #msheet{display:block;position:fixed;inset:auto 10px 10px;z-index:8;
          background:var(--paper);border:1px solid var(--rule);padding:16px;
          transform:translateY(130%);transition:transform 420ms cubic-bezier(.16,1,.3,1)}
  #msheet.open{transform:translateY(0)}
  #msheet .mt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
              color:var(--card-ink);opacity:.6;margin-bottom:6px}
  #msheet button{display:block;width:100%;text-align:left;border:0;background:transparent;
                 padding:11px 2px;font:inherit;font-size:15px;color:var(--card-ink);cursor:pointer;
                 border-bottom:1px solid var(--rule-2)}
  #msheet .mx{position:absolute;right:10px;top:8px;width:32px;font-size:22px;
              border-bottom:0;text-align:center;padding:0}
  #foot{padding-bottom:86px}
}
</style>
</head>
<body>

<div id="bar"></div>

<div id="halo" aria-hidden="true"></div>

<div id="scroller">
  <!-- The viewBox is authored here, not only set by the camera at runtime. Without it an SVG
      renders one user unit to one pixel, so a 2400-unit drawing with no script would paint at
      native size and crop — which is exactly the case the build's inlined drawing exists to
      cover. applyViewport() overwrites it on load (portrait swaps to its own frame), so this
      costs nothing and makes both first paint and the no-JS page correct. -->
 <div id="stage-wrap"><svg id="stage" viewBox="0 0 2400 1500"
      aria-label="The desk — one drawing, eight shots"></svg></div>
  <!-- <main>, not a div: the page had no main landmark, so a screen-reader user had no way to
       skip the drawing and the drafting furniture and get to the writing. All CSS and script
       reference it by id, so the element name is free to be the correct one. -->
  <main id="copy"></main>

  <!-- No closing section any more. It was a full-height block below the drawing carrying the warm
       sign-off, and it read as the page stopping and then starting again. The last card is the
       footer now, and the sign-off is the final line inside it. -->
</div>

<!-- Portrait only: one stuck panel that never moves. Content types out and back in as
     the active section changes, so it reads as a single terminal rather than a stack of
     cards travelling past. -->
<div id="tw" aria-live="polite">
  <div class="tag"><span class="eyebrow" id="tw-e"></span><span class="ref" id="tw-r"></span></div>
  <!-- Each line is split in two: the characters typed so far, and the rest held INVISIBLE
       rather than absent. visibility:hidden still occupies its space, so the panel is its
       finished height from the first character and nothing below it ever moves. Typing by
       appending text reflowed the box on almost every character and shoved the hint line
       down the screen — measured at 0.33 cumulative layout shift, where 0.1 is the limit. -->
  <h2 id="tw-h"><span class="on"></span><span class="off"></span></h2>
  <p id="tw-b"><span class="on"></span><span class="off"></span></p>
  <!-- The warm sign-off lives inside the last CARD, and cards are hidden on a phone — so without
       this the closing line simply did not exist on mobile. Filled only on the section that has
       one, and not typed: it is the line the page ends on, not part of the reveal. -->
  <p id="tw-c" class="cl"></p>
  <p class="hint">TAP ANY OBJECT TO JUMP TO ITS SECTION · ⊕ MORE MARKS EXTRA DETAIL</p>
</div>

<!-- Detail view. Opens from the object you tapped and pushes the drawing back behind it. -->
<div id="det" hidden>
  <div id="det-panel" role="dialog" aria-modal="true" aria-labelledby="det-t">
    <button id="det-x" aria-label="Close">×</button>
    <div class="tag"><span class="eyebrow" id="det-e"></span><span class="ref" id="det-r"></span></div>
    <h3 id="det-t"></h3>
    <div id="det-body"></div>
  </div>
</div>

<nav id="rail" aria-label="Sections"></nav>
<nav id="mobar" aria-label="Quick links"></nav>
<div id="msheet" aria-label="Jump to a section"></div>
<footer id="foot"></footer>
<div id="hud"></div>

<script type="module">
import { mountScene } from './assets/scene/scene.js';
import { sheetFurniture, BOM } from './assets/scene/sheet.mjs';
import { SHOTS } from './assets/scene/shots.js';
import { SECTIONS, KEYWORDS, NAV, FOOTER, OBJECT_SECTION } from './assets/scene/content.js';
import { panelsHTML, external } from './assets/scene/panels.js';

const pad = n => String(n).padStart(2, '0');

/* The panels come from the same module the build uses, and — like the drawing — are only
   built here if the served HTML did not already carry them. The built page ships the copy
   in the document so the writing survives with no JavaScript; rebuilding it would throw
   away markup the browser already has and already painted. */
const copyEl = document.getElementById('copy');
if (!copyEl.querySelector('section')) copyEl.innerHTML = panelsHTML(SHOTS, SECTIONS);

/* The devices in the drawing display the actual content, at full length. A list of
   headlines reads as thin, and thin does not earn anyone's trust — so the six audit
   steps are ON the monitor, readable once the camera arrives, rather than trimmed
   to a summary in the panel. */
/* object id -> the section whose deep content it owns */
const DETAIL_OF = Object.fromEntries(
  Object.entries(SECTIONS)
    .filter(([, s]) => s.deep && s.deep.on)
    .map(([id, s]) => [s.deep.on, id]));

const cam = mountScene(document.getElementById('stage'), {
  sheet: sheetFurniture(2400, 1500, { words: KEYWORDS }),
  copy: { monitor: SECTIONS.method.deep },
  markers: OBJECT_SECTION,
  details: Object.keys(DETAIL_OF),
  onObject: onObjectTap
});

/* Tapping ANY object in a group takes you to that group's section. Once you are already
   there, tapping any object in it opens the section's detail — it does not have to be the
   one prop that happens to own the detail view. Having to find that single right prop was
   the confusing, hard-to-hit part. */
let currentShot = 0;
function onObjectTap(objId) {
  const secId = OBJECT_SECTION[objId];
  if (!secId) return;
  const idx = SHOTS.findIndex(s => s.id === secId);
  const owner = SECTIONS[secId] && SECTIONS[secId].deep && SECTIONS[secId].deep.on;
  if (owner && currentShot === idx) { openDetail(owner); return; }
  if (idx >= 0) cam.goTo(idx + 1);
}
window.__cam = cam;   // so the camera can be driven and inspected from the console

/* The parts list navigates. Delegated from the stage rather than bound per row, because
   the rows are inside the SVG the build inlines — binding at build time is not available
   and re-binding after every rebuild is a bug waiting to happen. It goes through
   onObjectTap, so a row and its object can never disagree about where they lead. */
const stageEl = document.getElementById('stage');
stageEl.addEventListener('click', e => {
  const row = e.target.closest('.bomrow');
  if (row) onObjectTap(row.dataset.obj);
});
stageEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('.bomrow');
  if (!row) return;
  e.preventDefault();          // stop Space from scrolling the page out from under the jump
  onObjectTap(row.dataset.obj);
});
const bomRows = [...stageEl.querySelectorAll('.bomrow')];

/* rail */
const rail = document.getElementById('rail');
/* Labels in her voice, not my shot names. "Things I've made" told a reader what was in
   the site before they scrolled; "Work" is the name I gave the section while building. */
rail.innerHTML = SHOTS.map(s =>
  `<button data-n="${s.n}" title="${NAV[s.id] || s.title}">` +
  `<span class="rn">${s.n}</span><span class="rl">${NAV[s.id] || s.title}</span></button>`).join('');

/* Mobile navigation, which did not exist — the rail is hidden under 760px, so a phone
   had no way to reach anything. v1 had a persistent bar plus a named jump sheet. */
document.getElementById('mobar').innerHTML =
  `<button class="mb-g" data-n="5">${NAV.work}</button>` +
  `<button class="mb-s" data-n="8">${NAV.connect}</button>` +
  `<button class="mb-j" id="mjump" aria-label="Jump to a section">☰</button>`;
document.getElementById('msheet').innerHTML =
  `<button class="mx" id="mx" aria-label="Close">×</button><div class="mt">Jump to</div>` +
  SHOTS.filter(s => s.id !== 'statement')
       .map(s => `<button data-n="${s.n}">${NAV[s.id] || s.title}</button>`).join('');

document.getElementById('foot').textContent = FOOTER;

/* GRID PITCH for the footer's own texture, in pixels. The drawing's grid is 40 units on a
   2400-unit sheet, so the on-screen pitch is a function of the SVG's rendered width — which is
   min(100%, 1700px) and therefore different on nearly every window. Measuring it means the
   footer's grid continues the drawing's instead of nearly continuing it. */
function gridPitch() {
  const svg = document.getElementById('stage');
  const w = svg.clientWidth || 1400;
  document.documentElement.style.setProperty('--gp', (40 * w / 2400).toFixed(2) + 'px');
}
gridPitch();
addEventListener('resize', gridPitch);
rail.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) cam.goTo(+b.dataset.n);
});

/* in-panel buttons that fly the camera to another shot */
document.getElementById('copy').addEventListener('click', e => {
  const b = e.target.closest('[data-goto]');
  if (!b) return;
  /* the hero's own "Say hello" should also say hello rather than scroll somewhere */
  if (b.textContent.trim().toLowerCase() === 'say hello') openContact(b);
  else cam.goTo(+b.dataset.goto);
});

/* CONTACT. "Say hello" used to scroll to the connect section and stop there, which is not
   saying hello — it is being shown where hello would live. It now opens the actual ways to
   reach her, reusing the detail panel so the morph, the push-back and every close route
   (cross, Escape, backdrop, scroll) come for free. */
function openContact(from) {
  const links = (SECTIONS.connect.panel.links || []);
  detEls.e.textContent = SECTIONS.connect.panel.eyebrow;
  detEls.r.textContent = 'SK-01 · CONTACT';
  detEls.t.textContent = 'Say hello';
  detEls.b.innerHTML = `<div class="contact">` + links.map((l, i) =>
    `<a class="row crow" href="${l.href}"${l.download ? ' download' : ''}` +
    `${external(l.href) ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a>`).join('')
    + `</div>`;
  openPanelFrom(from);
}

/* mobile bar and jump sheet */
const msheet = document.getElementById('msheet');
document.getElementById('mobar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'mjump') msheet.classList.toggle('open');
  else if (b.classList.contains('mb-s')) openContact(b);
  else cam.goTo(+b.dataset.n);
});
msheet.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  msheet.classList.remove('open');
  if (b.dataset.n) cam.goTo(+b.dataset.n);
});
addEventListener('scroll', () => msheet.classList.remove('open'), { passive: true });

const bar = document.getElementById('bar');
const hud = document.getElementById('hud');
const btns = [...rail.querySelectorAll('button')];

/* ---- detail view --------------------------------------------------------
   The motion is the spec Saloni supplied: the panel morphs out of the object that was
   tapped, the drawing behind it scales down and fades so it reads as pushed back, and
   the rows unfold on a 60ms stagger. Closing reverses it, and a 20px scroll delta is
   enough to trigger that.

   The morph is a FLIP: measure the object, measure where the panel lands, then animate
   the panel FROM the transform that would map it onto the object TO its resting place.
   Which means the panel has to be laid out before it can be animated, so it is shown
   first and the animation is applied on the same frame. */
const det = document.getElementById('det');
const detPanel = document.getElementById('det-panel');
const detEls = { e: document.getElementById('det-e'), r: document.getElementById('det-r'),
                 t: document.getElementById('det-t'), b: document.getElementById('det-body') };
let detOpen = null, detScrollAt = 0;

function detailRows(d) {
  const row = (cls, tag, html, i) =>
    `<${tag} class="row ${cls}" style="--d:${60 + i * 60}ms;--from:${i % 2 ? '16px' : '-16px'}">${html}</${tag}>`;
  let i = 0;
  const out = d.items.map(it => {
    const parts = [];
    if (it.d) parts.push(row('dmeta', 'dt', it.d, i));
    parts.push(row('', 'dt', it.k, i));
    if (it.r) parts.push(row('drole', 'dd', it.r, i));
    parts.push(row('', 'dd', it.v, i));
    if (it.learned) parts.push(row('dlearn', 'dd', 'Learned: ' + it.learned, i));
    i++;
    return parts.join('');
  }).join('');
  const extras = (d.lessons ? d.lessons.map(l => row('dlearn', 'dd', '— ' + l, i++)).join('') : '')
    + (d.note ? row('dnote', 'p', d.note, i++) : '')
    + (d.link ? row('dnote', 'p', `<a href="${d.link.href}">${d.link.label} →</a>`, i++) : '');
  return `<dl>${out}</dl>${extras}`;
}

function openDetail(objId) {
  const secId = DETAIL_OF[objId];
  const sec = SECTIONS[secId];
  if (!sec || !sec.deep) return;
  const n = SHOTS.findIndex(s => s.id === secId) + 1;

  detEls.e.textContent = sec.panel.eyebrow;
  detEls.r.textContent = `SK-01 · ${pad(n)}/${pad(SHOTS.length)} · DETAIL`;
  detEls.t.textContent = sec.deep.title || sec.deep.label;
  detEls.b.innerHTML = detailRows(sec.deep);

  openPanelFrom(document.querySelector(`#p-${objId} .hit`), objId);
}

/* Shared open sequence for anything that uses the detail panel — the object detail views
   and the contact sheet. `from` is the element the panel should appear to grow out of. */
function openPanelFrom(fromEl, objId) {
  const from = fromEl && fromEl.getBoundingClientRect();

  det.hidden = false;
  document.body.classList.add('det-open');
  const sw = document.getElementById('stage-wrap');
  sw.style.transform = 'scale(.93)';
  sw.style.opacity = '.4';
  /* a truthy sentinel when there is no object — the contact sheet has no prop to morph back
     into, and leaving this falsy would make closeDetail() bail and trap the panel open */
  detOpen = objId || '__contact';
  detScrollAt = window.scrollY;

  if (from && from.width && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    const to = detPanel.getBoundingClientRect();
    const sx = Math.max(from.width / to.width, 0.08);
    const sy = Math.max(from.height / to.height, 0.08);
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    detPanel.animate(
      [{ transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: 0 },
       { transform: 'none', opacity: 1 }],
      { duration: 520, easing: 'cubic-bezier(.16,1,.3,1)' });

    /* The satellites unfold from behind the panel, sides alternating. The whole stagger
       is capped at 330ms regardless of row count: `fill: backwards` holds a row invisible
       until its delay elapses, and with fifteen rows at a fixed 55ms step the last one
       would sit blank for nearly a second — a long time to be betting on animations
       actually running. No forwards fill, so a finished row returns to its own visible
       style rather than being held by the animation. */
    const rows = detEls.b.querySelectorAll('.row');
    const step = rows.length > 1 ? 330 / (rows.length - 1) : 0;
    rows.forEach((r, i) => r.animate(
      [{ opacity: 0, transform: `translateX(${i % 2 ? 16 : -16}px)` },
       { opacity: 1, transform: 'none' }],
      { duration: 400, delay: 80 + i * step, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
  }
  document.getElementById('det-x').focus({ preventScroll: true });
}

function closeDetail() {
  if (!detOpen) return;
  const hit = document.querySelector(`#p-${detOpen} .hit`);
  const from = hit && hit.getBoundingClientRect();
  detOpen = null;
  document.body.classList.remove('det-open');
  const sw = document.getElementById('stage-wrap');
  sw.style.transform = '';
  sw.style.opacity = '';

  const done = () => { det.hidden = true; };
  if (from && from.width && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    const to = detPanel.getBoundingClientRect();
    const sx = Math.max(from.width / to.width, 0.08);
    const sy = Math.max(from.height / to.height, 0.08);
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    const a = detPanel.animate(
      [{ transform: 'none', opacity: 1 },
       { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: 0 }],
      { duration: 380, easing: 'cubic-bezier(.16,1,.3,1)' });
    a.onfinish = done;
  } else done();
}

document.getElementById('det-x').addEventListener('click', closeDetail);
det.addEventListener('click', e => { if (e.target === det) closeDetail(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
/* a nudge closes it — the spec asks for a 20px delta, not a full page scroll */
addEventListener('wheel', e => { if (detOpen && Math.abs(e.deltaY) > 20) closeDetail(); },
                 { passive: true });
addEventListener('touchmove', () => { if (detOpen) closeDetail(); }, { passive: true });
addEventListener('scroll', () => {
  if (detOpen && Math.abs(window.scrollY - detScrollAt) > 20) closeDetail();
}, { passive: true });

/* ---- the typewriter -----------------------------------------------------
   One stuck panel whose text is replaced by typing rather than by scrolling. A token
   guards every run: scrolling fast fires several section changes in a row, and without
   it two type-ins interleave character by character into gibberish. Any newer run
   silently abandons the older one mid-keystroke.

   The heading types as PLAIN text and is then swapped for its real HTML, so the yellow
   marker inks in once the words have landed. Typing the markup character by character
   would have printed the tags. */
const tw = {
  e: document.getElementById('tw-e'), r: document.getElementById('tw-r'),
  h: document.getElementById('tw-h'), b: document.getElementById('tw-b'),
  c: document.getElementById('tw-c')
};
/* the typed and untyped halves of each line, so the box can hold its full height */
for (const k of ['h', 'b']) {
  tw[k + 'On'] = tw[k].querySelector('.on');
  tw[k + 'Off'] = tw[k].querySelector('.off');
}
/** Write `n` characters of `full` into a line, keeping the remainder present but invisible. */
function twWrite(k, full, n, markup) {
  const on = tw[k + 'On'], off = tw[k + 'Off'];
  if (markup !== undefined) {
    /* Complete: swap in the real HTML so the yellow marker inks in. The remainder is emptied
       because the marked-up text carries every character the plain text did — same height. */
    if (on.innerHTML !== markup) on.innerHTML = markup;
    off.textContent = '';
  } else {
    on.textContent = full.slice(0, n);
    off.textContent = full.slice(n);
  }
}
const plain = html => html.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '');
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);

/* SCROLL-COUPLED, not time-based. The first version ran on timers, and on a page you
   navigate by scrolling that is simply wrong: the text was doing its own thing while you
   moved, so scrolling produced no immediate change, you kept going to see if anything
   would happen, and by then you had passed two sections.
   Now the character count is a FUNCTION of scroll position. Move a little and letters
   appear; stop and it stops; scroll back and it un-types. Nothing to wait for and
   nothing to miss.

     first 62% of a section   type in
     last 38%                 hold, fully typed, while the camera moves on

   The span used to be 20%, which meant the typing was over in a few ticks and the remaining
   four fifths of the scroll changed nothing at all — so it felt like several scrolls doing
   nothing followed by one where everything happened. Spread across most of the section,
   almost every scroll produces letters.

   There is deliberately NO type-out. Erasing on the way out cost the reader an extra
   stretch of scrolling to get to the next section — the text was busy undoing itself
   while they were trying to move on. The new section's text simply starts from nothing.

   It runs on the RAW section position, not the camera's. The camera deliberately holds
   still for the first 62% of a section, so its progress is zero for most of the scroll —
   typing against that meant nothing moved until the section was nearly over, which is
   exactly the "I scrolled and saw no change" problem. */
let twLast = '';

function twAt(raw) {
  const i = Math.max(0, Math.min(raw.i, SHOTS.length - 1));
  const t = raw.t;
  const id = SHOTS[i].id;
  const c = SECTIONS[id] && SECTIONS[id].panel;
  if (!c) return;

  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* 0.62 is NOT the camera's hold, even though it used to be the same number. This is the
     typewriter's own window — the fraction of a section over which the letters land — and it is
     set by how much scroll should produce visible typing, not by camera timing. It is also
     phone-only, and on a phone the camera does not move at all. The two just happened to share
     a value until the hold came down to 0.32; keeping them independent is correct. */
  const frac = reduce ? 1 : clamp01(t / 0.62);

  /* The body is typed as PLAIN text and swapped for its markup once complete, exactly as the
     heading is. Typing it with textContent while desktop renders it with innerHTML meant any
     <em> in a body would look right on a laptop and print as literal tag text on a phone —
     a trap waiting for whoever writes the copy, since <em> is already used in every heading. */
  const H = plain(c.head), Bp = plain(c.body);
  const shown = Math.round(frac * (H.length + Bp.length));

  const key = id + '|' + shown;
  if (key === twLast) return;            // one write per changed character, not per frame
  twLast = key;

  tw.e.textContent = c.eyebrow;
  tw.r.textContent = `SK-01 · ${pad(i + 1)}/${pad(SHOTS.length)}`;
  /* Shown once the body has finished, so the ending arrives after the words rather than sitting
     under an unfinished sentence. */
  if (tw.c) {
    const done = shown >= H.length + Bp.length;
    const want = c.close && done ? c.close : '';
    if (tw.c.innerHTML !== want) tw.c.innerHTML = want;
  }
  if (shown >= H.length) {
    twWrite('h', H, H.length, c.head);
    const complete = shown >= H.length + Bp.length;
    if (complete) twWrite('b', Bp, Bp.length, c.body);
    else twWrite('b', Bp, shown - H.length);
    tw.h.classList.remove('caret');
    tw.b.classList.toggle('caret', !complete);
  } else {
    twWrite('h', H, shown);
    /* The body's remainder stays in place even before the heading has finished, which is the
       whole point: its height is reserved from the moment the section starts. */
    twWrite('b', Bp, 0);
    tw.h.classList.add('caret');
    tw.b.classList.remove('caret');
  }
}

cam.onShot((near, p, raw) => {
  btns.forEach(b => b.setAttribute('aria-current', +b.dataset.n === near + 1));
  /* the progress bar follows the RAW position too, so it moves the moment you do */
  bar.style.width = ((raw.i + raw.t) / (SHOTS.length - 1) * 100).toFixed(2) + '%';
  currentShot = near;
  const hereId = SHOTS[near] && SHOTS[near].id;
  bomRows.forEach(r => r.classList.toggle('here', OBJECT_SECTION[r.dataset.obj] === hereId));
  /* The read-out is a development aid and the build strips it, so it may not exist.
     Guarded rather than assumed: an unguarded null here throws inside the scroll
     callback, which would take the camera and the typewriter down with it. */
  if (hud) {
    const s = cam.stats();
    hud.textContent = `SHOT ${near + 1}/${SHOTS.length} · ${SHOTS[near].title.toUpperCase()} · `
      + `${s.drawn}/${s.objects} OBJECTS DRAWN · ${s.paths} PATHS`;
  }
  twAt(raw);
});
</script>
